name: Release macOS

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, for example v1.0.2
        required: true
        type: string

permissions:
  contents: write

jobs:
  macos-dmg:
    name: Build signed and notarized DMG
    runs-on: macos-latest
    steps:
      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi

          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodebuild -version
          swift --version

      - name: Import Developer ID certificate
        shell: bash
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          set -euo pipefail

          if [[ -z "$MACOS_CERTIFICATE" || -z "$MACOS_CERTIFICATE_PWD" ]]; then
            echo "MACOS_CERTIFICATE and MACOS_CERTIFICATE_PWD secrets are required for release signing."
            exit 1
          fi

          cert_file="$(mktemp /tmp/md2loop-cert.XXXXXX)"
          keychain_file="/tmp/md2loop-build-${{ github.run_id }}.keychain-db"
          keychain_password="$(openssl rand -base64 32)"

          echo "$MACOS_CERTIFICATE" | base64 --decode > "$cert_file"
          curl -sL "https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer" -o /tmp/DeveloperIDG2CA.cer

          security create-keychain -p "$keychain_password" "$keychain_file"
          security set-keychain-settings -lut 21600 "$keychain_file"
          security unlock-keychain -p "$keychain_password" "$keychain_file"

          security import /tmp/DeveloperIDG2CA.cer -k "$keychain_file" -T /usr/bin/codesign
          security import "$cert_file" -P "$MACOS_CERTIFICATE_PWD" -A -t cert -f pkcs12 -k "$keychain_file"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain_file"

          user_keychains=()
          while IFS= read -r existing_keychain; do
            existing_keychain="${existing_keychain#*\"}"
            existing_keychain="${existing_keychain%\"*}"
            if [[ -n "$existing_keychain" ]]; then
              user_keychains+=("$existing_keychain")
            fi
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain_file" "${user_keychains[@]}"

          identity="$(security find-identity -v -p codesigning "$keychain_file" | grep 'Developer ID Application' | head -1 | sed 's/.*"\(.*\)"/\1/')"
          if [[ -z "$identity" ]]; then
            echo "Developer ID Application identity not found in imported certificate."
            exit 1
          fi

          echo "CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "KEYCHAIN_FILE=$keychain_file" >> "$GITHUB_ENV"

          rm -f "$cert_file" /tmp/DeveloperIDG2CA.cer

      - name: Build signed app
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          CODESIGN_IDENTITY: ${{ env.CODESIGN_IDENTITY }}
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          ./scripts/build_release.sh

      - name: Notarize and validate app
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APP_PATH: dist/md2loop.app
        run: |
          set -euo pipefail

          if [[ -z "$APPLE_ID" || -z "$APPLE_TEAM_ID" || -z "$APPLE_APP_PASSWORD" ]]; then
            echo "APPLE_ID, APPLE_TEAM_ID, and APPLE_APP_PASSWORD secrets are required for notarization."
            exit 1
          fi

          ./scripts/notarize_app.sh

      - name: Build signed DMG
        shell: bash
        env:
          CODESIGN_IDENTITY: ${{ env.CODESIGN_IDENTITY }}
          DMG_PATH: dist/md2loop-${{ steps.release.outputs.version }}-macos.dmg
        run: |
          set -euo pipefail
          ./scripts/make_dmg.sh

      - name: Notarize DMG
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          DMG_PATH: dist/md2loop-${{ steps.release.outputs.version }}-macos.dmg
        run: |
          set -euo pipefail

          if [[ -z "$APPLE_ID" || -z "$APPLE_TEAM_ID" || -z "$APPLE_APP_PASSWORD" ]]; then
            echo "APPLE_ID, APPLE_TEAM_ID, and APPLE_APP_PASSWORD secrets are required for notarization."
            exit 1
          fi

          ./scripts/notarize_dmg.sh

      - name: Validate notarized release artifact
        shell: bash
        env:
          DMG_PATH: dist/md2loop-${{ steps.release.outputs.version }}-macos.dmg
        run: |
          set -euo pipefail
          ./scripts/verify_release_dmg.sh

      - name: Cleanup keychain
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${KEYCHAIN_FILE:-}" ]]; then
            security delete-keychain "$KEYCHAIN_FILE" 2>/dev/null || true
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: md2loop-macos-dmg
          if-no-files-found: error
          path: |
            dist/md2loop-${{ steps.release.outputs.version }}-macos.dmg
            dist/md2loop-${{ steps.release.outputs.version }}-macos.dmg.sha256

      - name: Attach assets to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          notes_file="$(mktemp)"
          cat > "$notes_file" <<NOTES
          Signed and notarized macOS DMG for md2loop ${RELEASE_VERSION}.

          Verify the download with:

          \`\`\`bash
          shasum -a 256 -c md2loop-${RELEASE_VERSION}-macos.dmg.sha256
          \`\`\`
          NOTES

          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --title "md2loop ${RELEASE_VERSION}" \
              --notes-file "$notes_file"
          fi

          gh release upload "$RELEASE_TAG" \
            "dist/md2loop-${RELEASE_VERSION}-macos.dmg" \
            "dist/md2loop-${RELEASE_VERSION}-macos.dmg.sha256" \
            --clobber
