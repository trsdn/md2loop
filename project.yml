name: md2loop
options:
  bundleIdPrefix: com.md2loop
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

packages:
  swift-markdown:
    url: https://github.com/swiftlang/swift-markdown.git
    branch: main
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    from: "2.6.0"

targets:
  md2loop:
    type: application
    platform: macOS
    sources:
      - Sources/md2loop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.md2loop.app
        PRODUCT_NAME: md2loop
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Sources/md2loop/Info.plist
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Sources/md2loop/md2loop.entitlements
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
    dependencies:
      - package: swift-markdown
        product: Markdown
      - package: SwiftSoup
        product: SwiftSoup
    entitlements:
      path: Sources/md2loop/md2loop.entitlements
